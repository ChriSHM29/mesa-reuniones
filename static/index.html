<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111a3a">
    <meta name="description" content="Tablero de reuniones del equipo BaaS Lite.">
    <title>Mesa · BaaS Lite</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Mesa, inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V6A1.5 1.5 0 0 1 5 4.5Z"/><path d="M8 8h3v8H8zm5 0h3v5h-3z"/></svg>
          <span>Mesa</span>
        </a>
        <nav aria-label="Navegación principal">
          <button class="topbar-link is-active" type="button">Tableros</button>
          <button class="topbar-link" type="button">Calendario</button>
        </nav>
        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          </button>
          <button class="profile-button" type="button" aria-label="Perfil de Julio Pariona">JP</button>
        </div>
      </header>

      <section class="board-header" aria-labelledby="board-title">
        <div>
          <p class="eyebrow" id="workspace-name">BaaS Lite</p>
          <div class="title-row">
            <h1 id="board-title">Plan de trabajo · 10 semanas</h1>
            <span class="visibility-pill">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v9H4z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              Equipo
            </span>
          </div>
          <p class="board-subtitle"><span id="meeting-count">0 reuniones</span><span aria-hidden="true">·</span><span id="date-range"></span></p>
        </div>
        <div class="board-tools">
          <div class="member-stack" id="member-stack" aria-label="Miembros del equipo"></div>
          <span class="team-count">5 personas</span>
          <button class="secondary-button" type="button" id="view-toggle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M8 2.8v3.4M16 2.8v3.4M3.5 9h17"/></svg>
            Ver fechas
          </button>
        </div>
      </section>

      <main class="board-canvas" aria-label="Tablero de reuniones">
        <div class="board" id="board" aria-busy="true"></div>
      </main>
    </div>

    <dialog class="meeting-dialog" id="meeting-dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="meeting-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Reprogramar reunión</p>
            <h2 id="dialog-title">Cambiar fecha</h2>
          </div>
          <button class="icon-button dark" value="cancel" aria-label="Cerrar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="dialog-copy" id="dialog-card-title"></p>
        <input type="hidden" id="card-id" name="cardId">
        <div class="form-grid">
          <label>
            <span>Fecha</span>
            <input type="date" id="meeting-date" name="date" required>
          </label>
          <label>
            <span>Hora</span>
            <input type="time" id="meeting-time" name="time" required>
          </label>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button class="secondary-button dark-text" value="cancel" type="button" id="cancel-dialog">Cancelar</button>
          <button class="primary-button" type="submit" id="save-meeting">Guardar cambio</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
